<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-dot {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .float-screen-1 {
      animation: float1 5s ease-in-out infinite alternate;
    }
    .float-screen-2 {
      animation: float2 6s ease-in-out infinite alternate;
    }
    .float-screen-3 {
      animation: float3 4.5s ease-in-out infinite alternate;
    }
    .scan-line {
      animation: scan 4s linear infinite;
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
    @keyframes float3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(90px); opacity: 0; }
    }
    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .code-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs / Accents in Background -->
  <circle cx="150" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.15" class="pulse-dot" />
  <circle cx="1050" cy="300" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.15" class="pulse-dot" />

  <!-- Dynamic Multi-Screen / Device Viewport Mockups (Visual Aspect) -->
  <!-- Screen 1: Desktop Screen Mockup -->
  <g class="float-screen-1" transform="translate(730, 65)">
    <rect width="410" height="230" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
    <!-- Window Header -->
    <rect width="410" height="28" rx="10" fill="#1e293b" />
    <circle cx="18" cy="14" r="5" fill="#ef4444" />
    <circle cx="34" cy="14" r="5" fill="#eab308" />
    <circle cx="50" cy="14" r="5" fill="#22c55e" />
    <rect x="75" y="7" width="220" height="14" rx="4" fill="#0f172a" />
    <text x="140" y="18" fill="#94a3b8" class="code-font" font-size="10">1920 x 1080 (Desktop)</text>
    
    <!-- Screen Content Mockup -->
    <rect x="20" y="45" width="110" height="55" rx="6" fill="#334155" opacity="0.7" />
    <rect x="145" y="45" width="245" height="16" rx="4" fill="#38bdf8" opacity="0.6" />
    <rect x="145" y="70" width="200" height="10" rx="4" fill="#64748b" opacity="0.5" />
    <rect x="145" y="88" width="160" height="10" rx="4" fill="#64748b" opacity="0.5" />

    <!-- Mock Grid Columns -->
    <rect x="20" y="115" width="115" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="150" y="115" width="115" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="280" y="115" width="110" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    
    <!-- Scan effect beam -->
    <line x1="20" y1="40" x2="390" y2="40" stroke="#38bdf8" stroke-width="2" opacity="0.7" class="scan-line" />
  </g>

  <!-- Screen 2: Tablet Mockup -->
  <g class="float-screen-2" transform="translate(640, 150)">
    <rect width="180" height="230" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="2" />
    <rect width="180" height="24" rx="12" fill="#1e293b" />
    <circle cx="90" cy="12" r="3" fill="#64748b" />
    <text x="90" y="40" fill="#a5b4fc" class="code-font" font-size="10" text-anchor="middle">768px (Tablet)</text>
    <rect x="15" y="52" width="150" height="30" rx="4" fill="#4f46e5" opacity="0.4" />
    <rect x="15" y="92" width="150" height="55" rx="4" fill="#334155" opacity="0.6" />
    <rect x="15" y="157" width="150" height="55" rx="4" fill="#334155" opacity="0.6" />
  </g>

  <!-- Screen 3: Mobile Phone Mockup -->
  <g class="float-screen-3" transform="translate(970, 180)">
    <rect width="120" height="210" rx="16" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="2" />
    <rect x="42" y="6" width="36" height="6" rx="3" fill="#475569" />
    <circle cx="60" cy="198" r="5" fill="#475569" />
    <text x="60" y="32" fill="#d8b4fe" class="code-font" font-size="9" text-anchor="middle">375px (Mobile)</text>
    <rect x="12" y="42" width="96" height="35" rx="4" fill="#9333ea" opacity="0.4" />
    <rect x="12" y="85" width="96" height="42" rx="4" fill="#334155" opacity="0.7" />
    <rect x="12" y="135" width="96" height="42" rx="4" fill="#334155" opacity="0.7" />
  </g>

  <!-- Foreground Typography & Branding (High Visibility Guaranteed) -->
  <g transform="translate(70, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 75)">
      <rect width="265" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="18" cy="17" r="6" fill="#38bdf8" class="pulse-dot" />
      <text x="34" y="22" fill="#38bdf8" class="code-font" font-weight="700">RESPONSIVE DESIGN &amp; QA</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" fill="#f8fafc" font-size="44" class="title-text">
      Awesome Responsive
    </text>
    <text x="0" y="218" fill="url(#accentGrad)" font-size="44" class="title-text">
      Multi-Screen Testing ⚡
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="265" fill="#94a3b8" font-size="16" class="sub-text">
      Curated suite of viewport previewers, synchronized dev browsers,
    </text>
    <text x="0" y="290" fill="#94a3b8" font-size="16" class="sub-text">
      and automated layout &amp; visual regression testing tools.
    </text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 325)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="67" y="20" fill="#e2e8f0" font-size="12" class="code-font" text-anchor="middle">📱 Multi-Viewport</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="135" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="212" y="20" fill="#e2e8f0" font-size="12" class="code-font" text-anchor="middle">🔄 Synced Events</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="365" y="20" fill="#e2e8f0" font-size="12" class="code-font" text-anchor="middle">🎯 Visual Regression</text>
    </g>
  </g>
</svg>
